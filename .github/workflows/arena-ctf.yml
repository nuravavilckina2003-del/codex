name: Temporary CTF HTTP probe

on:
  push:
    branches:
      - arena/93aa1301-codex
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install temporary probe dependencies
        run: python3 -m pip install --quiet pypdf websocket-client
      - name: Run isolated CTF probe
        run: python3 .ctf/probe.py > .ctf/output.txt 2>&1
        env:
          # Explicitly do not pass the repository token to the probe.
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
      - name: Publish probe output without retriggering Actions
        if: always()
        run: |
          git config user.name 'arena-ctf-probe'
          git config user.email 'arena-ctf-probe@users.noreply.github.com'
          git add .ctf/output.txt
          find .ctf -maxdepth 1 -name 'thumb_*.png' -exec git add {} +
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update CTF probe output [skip ci]'
            git push origin HEAD:arena/93aa1301-codex
          fi
