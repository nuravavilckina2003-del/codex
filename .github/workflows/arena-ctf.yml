name: Temporary CTF HTTP probe

on:
  push:
    branches:
      - arena/93aa1301-codex
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated CTF probe
        run: python3 .ctf/probe.py
        env:
          # Explicitly do not pass the repository token to the probe.
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
